# Only the scaffolding is maintained in this repository (see README
# "Contributing"): go.mod/go.sum are synced from hivecommons/hive src/crux and
# the Sync guard rejects PRs that touch them, so the gomod ecosystem is
# deliberately absent here.
#
# The docker ecosystem covers the literal FROM images: golang and alpine in
# Dockerfile, alpine in Dockerfile.goreleaser. Keep every FROM a literal
# reference (no ARG indirection); Dependabot does not resolve ARG defaults
# (dependabot/dependabot-core#2057) and would silently stop tracking the base.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /
    schedule:
      interval: weekly
    groups:
      docker-bases:
        patterns: ["*"]
