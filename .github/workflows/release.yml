name: Release

# Runs on tags vX.Y.Z, which hive's crux-sync workflow pushes when hive is
# tagged crux/vX.Y.Z (a tag may also be pushed here directly). goreleaser
# builds darwin/linux × amd64/arm64 archives + checksums (cosign keyless
# signed), the multi-arch ghcr.io/hivecommons/crux image, and the GitHub
# release with generated notes. The Homebrew formula lives in
# hivecommons/homebrew-hive (Formula/crux.rb) and is bumped by PR.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.1.0'
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag sanity
        run: |
          set -euo pipefail
          tag="$(git describe --tags --exact-match HEAD)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]] || { echo "::error::HEAD tag '$tag' is not vX.Y.Z" >&2; exit 1; }
          test -f cmd/crux/main.go || { echo "::error::cmd/crux is not in this tree; nothing to release" >&2; exit 1; }
          echo "Releasing $tag from $(grep '^hive_sha=' .hive-sync || echo 'unknown hive sha')"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-release smoke
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q tmux
          go build -trimpath -ldflags "-X main.version=$(git describe --tags --exact-match HEAD)" -o crux ./cmd/crux
          ./crux --version
          CRUX_BIN="$PWD/crux" scripts/smoke.sh
          rm -f crux
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        run: |
          {
            echo "## crux ${GITHUB_REF_NAME}"
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            echo "- Image: \`ghcr.io/hivecommons/crux:${GITHUB_REF_NAME#v}\`"
            echo "- \`go install github.com/hivecommons/crux/cmd/crux@${GITHUB_REF_NAME}\`"
            echo "- Hive source: $(grep '^source=' .hive-sync | cut -d= -f2-)"
          } >> "$GITHUB_STEP_SUMMARY"
